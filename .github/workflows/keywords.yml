name: Keyword Agent

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Optional: comma-separated seed phrases (overrides config.yaml)"
        required: false
        default: ""
      niche:
        description: "Optional: niche name (overrides config.yaml)"
        required: false
        default: ""

jobs:
  keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run keyword agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KEYWORD_SEEDS: ${{ github.event.inputs.seeds }}
          KEYWORD_NICHE: ${{ github.event.inputs.niche }}
        run: python main.py

      - name: Upload keyword plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-plan
          path: |
            output/
            run_summary.json
          if-no-files-found: ignore
