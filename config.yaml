# ------------------------------------------------------------------
# Keyword Agent: turns seed ideas into a keyword-to-article plan.
# Free: Google autocomplete + Google Trends + Groq. No paid SEO tool.
# ------------------------------------------------------------------
niche: "under-door draft stoppers"
seeds:                       # 1-3 short phrases; the agent expands each one
  - door draft stopper

# Months (1-12) when demand peaks. Used when Google Trends is unavailable
# (it often is from cloud IPs). Then it is labelled "user_declared", never "verified".
declared_peak_months: [10, 11, 12, 1, 2]

# Which search boxes to ask for keyword ideas (all free, no key). If one is blocked the others still work.
# Amazon's suggestions are what shoppers type, which suits an affiliate site.
sources: [google, bing, duckduckgo, amazon]

limits:
  pause_seconds: 0.25        # polite delay between search-box requests
  max_keywords: 90           # keywords kept after cleaning (the model clusters these)
  max_clusters: 12
  expand_depth: 2            # 1 = seed + modifiers + A-Z, 2 = also expand the best finds again
  depth2_seeds: 12           # how many finds get the second expansion
  trends_clusters: 6         # primaries checked on Google Trends (only if Trends works at all)

llm:
  model: "openai/gpt-oss-120b"
  max_tokens: 5000

# Priority score (higher = publish sooner). Missing components are dropped and the rest re-weighted.
weights:
  intent: 0.30     # commercial / transactional beats informational for an affiliate site
  gap: 0.30        # topics you have not covered
  breadth: 0.20    # how many distinct searches Google suggests (a weak demand proxy)
  season: 0.20     # peak month is now or next month

# ------------------------------------------------------------------
# Content ideas (ideas.py): ideas only, from products.csv (or the IDEAS_PRODUCTS workflow box)
# ------------------------------------------------------------------
ideas:
  products_file: products.csv
  platforms: [article, youtube, social, pinterest]   # article = WordPress, social = Facebook/Instagram
  per_platform: 8
  max_products: 6            # per category
  max_categories: 3          # products are grouped by the `category` column; one folder of ideas per category
  hands_on_testing: false    # false = ideas never claim you tested the product
  max_tokens: 4000
  providers: [gemini, groq]  # tried in order; a provider with no API key is skipped
  research: true             # Perplexity web-research step (what shoppers ask). Runs only if PERPLEXITY_API_KEY is set. PAID per request
  research_effort: fast

# Gemini model names are tried in order (a retired name gives 404 and the next one is used). Check Google AI Studio for current names.
gemini:
  models: [gemini-3.5-flash, gemini-2.5-flash, gemini-2.5-flash-lite]

# ------------------------------------------------------------------
# Output tables: xlsx = one Excel workbook (default), csv = separate CSV files, both = write both
# ------------------------------------------------------------------
output_format: xlsx
